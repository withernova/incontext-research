[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "iploc-szy"
version = "0.1.0"
description = "Config-driven Qwen3-VL SFT and IPLoc pipeline"
requires-python = ">=3.9"
dependencies = ["torch", "transformers", "peft", "accelerate", "Pillow"]
[tool.setuptools.packages.find]
include = ["iploc_szy*"]
